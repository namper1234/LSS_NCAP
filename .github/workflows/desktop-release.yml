name: Desktop release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Test and build Linux release
        run: bash packaging/build_linux_complete.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: dist/LSS_NCAP_Tool-linux-x86_64.zip
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . -r packaging/build-requirements.txt
      - name: Test and build Windows release
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw "Unit tests failed" }
          ./packaging/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/LSS_NCAP_Tool-windows-x86_64.zip
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-release
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release-assets
      - name: Publish tested ZIP files
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          release-assets/LSS_NCAP_Tool-linux-x86_64.zip
          release-assets/LSS_NCAP_Tool-windows-x86_64.zip
          --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
